<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ site.title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        header {
            background-color: #010409;
            border-bottom: 2px solid #238636;
            padding: 1.5rem 0;
        }

        header h1 {
            color: #238636;
            text-align: center;
            font-size: 2rem;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        nav {
            background-color: #161b22;
            padding: 1rem 0;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 99;
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
        }

        nav a {
            color: #79c0ff;
            text-decoration: none;
            font-weight: 500;
            padding-bottom: 0.25rem;
            transition: all 0.3s ease;
        }

        nav a:hover {
            color: #238636;
        }

        main {
            padding: 2rem 0;
            min-height: calc(100vh - 300px);
        }

        h1 {
            color: #238636;
            border-bottom: 2px solid #238636;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }

        h2 {
            color: #79c0ff;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        h3 {
            color: #a371f7;
            margin-top: 1rem;
        }

        a {
            color: #79c0ff;
            text-decoration: none;
        }

        a:hover {
            color: #238636;
            text-decoration: underline;
        }

        code {
            background-color: #161b22;
            color: #79c0ff;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: monospace;
        }

        pre {
            background-color: #161b22;
            border-left: 4px solid #238636;
            padding: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
        }

        blockquote {
            border-left: 4px solid #238636;
            padding-left: 1rem;
            color: #8b949e;
            font-style: italic;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
        }

        table th {
            background-color: #161b22;
            color: #238636;
            padding: 0.75rem;
            text-align: left;
            border: 1px solid #30363d;
        }

        table td {
            padding: 0.75rem;
            border: 1px solid #30363d;
        }

        table tr:hover {
            background-color: #161b22;
        }

        footer {
            background-color: #010409;
            border-top: 2px solid #238636;
            padding: 2rem 0;
            text-align: center;
            color: #8b949e;
            margin-top: 3rem;
        }

        footer a {
            color: #238636;
        }

        footer a:hover {
            color: #79c0ff;
        }

        hr {
            border: none;
            border-top: 1px solid #30363d;
            margin: 2rem 0;
        }

        @media (max-width: 768px) {
            nav ul {
                flex-direction: column;
                gap: 0.5rem;
            }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🛡️ SOC Analyst Portfolio</h1>
        </div>
    </header>

    <nav>
        <div class="container">
            <ul>
                <li><a href="{{ '/' | relative_url }}">Home</a></li>
                <li><a href="{{ '/1.detections/' | relative_url }}">Detections</a></li>
                <li><a href="{{ '/2.investigations/' | relative_url }}">Investigations</a></li>
                <li><a href="{{ '/3.log-analysis/' | relative_url }}">Log Analysis</a></li>
                <li><a href="{{ '/4.hunting/' | relative_url }}">Threat Hunting</a></li>
                <li><a href="{{ '/5.projects/' | relative_url }}">Labs</a></li>
                <li><a href="{{ '/6.documents/' | relative_url }}">Docs</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="container">
            {{ content }}
        </div>
    </main>

    <footer>
        <div class="container">
            <p><strong>Magda Dominguez</strong> | SOC Analyst (L1-ready) - Bristol, UK</p>
            <p><a href="https://linkedin.com/in/magda-d-infosec">LinkedIn</a> | <a href="https://github.com/magda-uk">GitHub</a></p>
        </div>
    </footer>
</body>
</html>
